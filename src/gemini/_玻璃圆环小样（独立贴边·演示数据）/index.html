<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini 暗色圆环预览（演示数据）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="orbShell" class="orb-shell">
    <button id="orb" class="orb-button surface" data-hit aria-label="Gemini剩余用量">
      <svg id="orbRings" class="orb-rings" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <span id="orbValue" class="orb-value"><span id="orbNumber">68</span><small>%</small></span>
    </button>
  </div>
  <section id="details" class="details surface" data-hit role="region" aria-label="Gemini用量详情">
    <header class="details-header">
      <div class="account-heading"><i id="accountDot"></i><strong id="accountName">2号</strong></div>
      <div id="accountTabs" class="account-tabs" role="tablist" aria-label="选择账号"></div>
      <button class="close-button" data-action="close" title="收起详情" aria-label="收起详情">×</button>
    </header>
    <dl class="detail-grid">
      <div><dt>5小时剩余</dt><dd class="important"><span id="detailNumber">68</span><small>%</small></dd></div>
      <div><dt>重置时间</dt><dd id="detailReset">16:05</dd></div>
      <div><dt>本周剩余</dt><dd id="detailWeekly">55%</dd></div>
      <div><dt>本周重置</dt><dd id="detailWeeklyReset">周六 10:00</dd></div>
      <div><dt>套餐 / 余额</dt><dd class="not-connected">尚未接入</dd></div>
    </dl>
    <footer class="details-footer">
      <span class="demo-label">演示数据</span>
      <div class="demo-count" aria-label="演示账号数量"><button data-count="1" aria-label="演示一个账号">1</button><button data-count="2" aria-label="演示两个账号">2</button><button data-count="3" aria-label="演示三个账号">3</button></div>
      <button class="exit-button" data-action="quit">退出预览</button>
    </footer>
  </section>
  <script src="interaction.js"></script>
  <script src="ui.js"></script>
</body>
</html>
