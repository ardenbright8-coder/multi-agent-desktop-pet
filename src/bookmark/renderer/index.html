<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Agent 看板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span class="sun" aria-hidden="true">☀</span>
      <span class="title">Agent 看板</span>
      <span class="title-version" id="title-version" title="看板版本（git短hash·启动时间）；重载不变，重启才变"></span>
      <span class="hint">F3 显示 / 收起</span>
      <button id="hide-btn" type="button" title="收起（F3）">─</button>
    </header>

    <!-- 页签栏：待定 / Agent 分组 两页切换（2026-09-10 用户拍板：上下分层改左右两页，每页占满面板能多放条目） -->
    <nav id="page-tabs">
      <button id="tab-inbox" type="button" class="page-tab active" data-page="inbox">
        💭 待定 <span id="tab-inbox-count" class="tab-count">0</span>
      </button>
      <button id="tab-groups" type="button" class="page-tab" data-page="groups">🤖 Agent 分组</button>
    </nav>

    <!-- 看板：分组全部由 bookmark.js 渲染（按当前页签只画待定区或 agent 分组） -->
    <main id="board"></main>

    <footer id="board-foot">
      <button id="add-agent-btn" type="button" title="加一个 Agent 分组" hidden>＋ 加Agent</button>
      <span id="board-error" role="alert"></span>
    </footer>

    <!-- 加Agent 的内联输入行 -->
    <div id="add-agent-row" hidden>
      <input id="new-agent-name" type="text" maxlength="24" placeholder="Agent 名字（如 Codex）" />
      <button id="new-agent-ok" type="button">添加</button>
      <button id="new-agent-cancel" type="button">取消</button>
    </div>

    <!-- 右键/点手柄弹出的派给菜单（内容由 js 填） -->
    <div id="ctx-menu" hidden></div>
  </div>
  <script src="bookmark.js"></script>
</body>
</html>
